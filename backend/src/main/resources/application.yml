spring:
  application:
    name: afaq-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/afaq}
    username: ${SPRING_DATASOURCE_USERNAME:afaq}
    password: ${SPRING_DATASOURCE_PASSWORD:afaq}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_STORAGE_MAX_REQUEST_SIZE:6MB}
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    upload-directory: ${UPLOAD_DIRECTORY:./uploads}
    max-file-size-bytes: ${APP_STORAGE_MAX_FILE_SIZE_BYTES:5242880}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
