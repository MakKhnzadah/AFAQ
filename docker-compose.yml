services:
  postgres:
    image: postgres:16-alpine
    container_name: afaq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afaq}
      POSTGRES_USER: ${POSTGRES_USER:-afaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afaq}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afaq} -d ${POSTGRES_DB:-afaq}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afaq-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/afaq}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-afaq}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-afaq}
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
